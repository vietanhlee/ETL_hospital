include:
  - docker-compose.data.yml    # Database (MySQL, ClickHouse)
  - docker-compose.hdfs.yml    # Hadoop Distributed File System
  - docker-compose.spark.yml   # Cluster xử lý dữ liệu lớn Spark
  - docker-compose.airflow.yml # Công cụ điều phối luồng chạy Airflow
  - docker-compose.mlops.yml   # Tracking MLflow

# ==========================================
# KHAI BÁO VOLUMES (LƯU TRỮ VĨNH VIỄN)
# Khai báo ở đây giúp Docker tự động tạo volume dùng chung cho toàn bộ dự án
# ==========================================
volumes:
  mysql_data:
  namenode_data:
  datanode_data:
  postgres_data:
  clickhouse_data:
  mlflow_data:

# ==========================================
# KHAI BÁO NETWORKS (MẠNG ẢO DÙNG CHUNG)
# Các container trong các file trên đều có thể nhìn thấy nhau thông qua mạng này
# ==========================================
networks:
  etl_network:
    driver: bridge
