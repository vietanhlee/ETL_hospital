services:
  # ==========================================
  # HỆ THỐNG LƯU TRỮ PHÂN TÁN (HDFS)
  # ==========================================
  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-namenode
    restart: always
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://hdfs-namenode:8020 # Định nghĩa địa chỉ gốc của HDFS (Port 8020 là cổng RPC cho NameNode)
    ports:
      - "9870:9870" # Cổng giao diện Web UI của HDFS NameNode để bạn xem thông tin thư mục, file
      - "9000:9000" # Cổng IPC cũ (dự phòng)
    volumes:
      - namenode_data:/hadoop/dfs/name # Lưu trữ metadata của HDFS (cấu trúc thư mục, vị trí các block file)
    networks:
      - etl_network

  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode
    restart: always
    environment:
      - SERVICE_PRECONDITION=hdfs-namenode:9870 # Đảm bảo NameNode khởi động và sẵn sàng ở Web UI port 9870 thì DataNode mới bắt đầu chạy
      - CORE_CONF_fs_defaultFS=hdfs://hdfs-namenode:8020 # Cấu hình trỏ tới NameNode để DataNode biết kết nối tới đâu
    ports:
      - "9864:9864" # Cổng Web UI / HTTP API của DataNode
    volumes:
      - datanode_data:/hadoop/dfs/data # Nơi lưu trữ các block dữ liệu thực tế của HDFS
    networks:
      - etl_network
    depends_on:
      - hdfs-namenode # Yêu cầu container hdfs-namenode phải chạy trước

volumes:
  namenode_data:
  datanode_data:

networks:
  etl_network:
